[workspace]
resolver = "2"
members = [
    "crates/man0",
    "contracts/factory",
    "contracts/reputation",
    "contracts/validation",
    "contracts/workflow",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/man0-space/contracts"

[workspace.dependencies]
near-sdk = { version = "5.30.1", features = ["legacy"] }
borsh = { version = "1.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"
man0 = { path = "crates/man0" }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = "symbols"
